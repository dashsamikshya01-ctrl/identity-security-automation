name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pytest
      - name: Unit tests
        run: python -m pytest -q secrets-scanner/tests
      - name: Rebuild datasets and run every demo
        run: |
          python tools/generate_datasets.py
          python saml-cert-lifecycle/lifecycle.py
          python secrets-scanner/scanner.py --report
          python self-healing-ops/triage.py
          python gdpr-dsr-automation/processor.py
          python session-revocation/respond.py
      - name: Scan this repo for secrets (dogfooding)
        run: python secrets-scanner/scanner.py .
